services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOST: onmute-cuzu5ciu.avitoctf.ru
      PORT: 3000
    restart: always
    pids_limit: 10000
    stop_grace_period: 0s
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
